name: School Management V5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract V5 ZIP
        run: |
          set -e

          mkdir -p v5_project

          unzip -q school_management_v5_clean_login_dashboard.zip \
            -d v5_project

          echo "V5 ZIP extracted."

      - name: Find Flutter Project
        run: |
          set -e

          PUBSPEC=$(find v5_project -type f \
            -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Check V5
        run: |
          set -e

          test -f "$APP_DIR/pubspec.yaml"
          test -f "$APP_DIR/lib/main.dart"

          echo "V5 project structure is OK."

      - name: Generate Android
        run: |
          cd "$APP_DIR"

          flutter create . \
            --platforms=android \
            --org=com.schoolmanagement

      - name: Install Dependencies
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Build V5 APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd "$APP_DIR"

          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://yeqpkotyeqvajxanlzpj.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare APK
        run: |
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            "$GITHUB_WORKSPACE/school-management-v5.apk"

      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-v5-apk
          path: school-management-v5.apk
